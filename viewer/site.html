<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Lab - Japan Site Scout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container { width: 100vw; height: 100vh; }

        .panel {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
        }
        #controls { top: 20px; left: 20px; max-width: 320px; }
        #controls h2 { margin-bottom: 10px; font-size: 16px; color: #ff6b6b; }
        #controls h3 {
            margin-top: 12px; margin-bottom: 8px; font-size: 13px;
            color: #4ecdc4; border-top: 1px solid #333; padding-top: 10px;
        }
        #controls label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        #controls input[type="range"] { flex: 1; accent-color: #ff6b6b; }
        #controls select {
            flex: 1; background: #333; color: #eee;
            border: 1px solid #555; padding: 5px; border-radius: 4px;
        }
        #controls button {
            background: #4ecdc4; color: #1a1a2e; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            margin: 3px 2px; font-size: 12px; font-weight: 500;
        }
        #controls button:hover { background: #3dbdb5; }
        #controls button.secondary { background: #444; color: #eee; }
        #controls button.secondary:hover { background: #555; }
        #controls button.viewpoint { background: #f9ca24; color: #1a1a2e; }
        #controls button.viewpoint:hover { background: #e0b820; }

        .site-info {
            background: rgba(78, 205, 196, 0.15);
            border: 1px solid #4ecdc4;
            border-radius: 4px; padding: 10px; margin: 10px 0; font-size: 12px;
        }
        .site-info .name { font-weight: bold; color: #4ecdc4; font-size: 14px; }
        .site-info .prefecture { color: #888; font-size: 11px; }
        .site-info .metric { margin-top: 4px; }
        .site-info .value { color: #00ffcc; font-weight: bold; }

        #stats { top: 20px; right: 20px; max-width: 260px; }
        #stats h2 { margin-bottom: 10px; font-size: 16px; color: #4ecdc4; }
        #stats h3 { margin-top: 10px; margin-bottom: 6px; font-size: 12px; color: #f9ca24; }
        #stats table { width: 100%; border-collapse: collapse; }
        #stats td { padding: 3px 0; font-size: 12px; }
        #stats td:first-child { color: #888; }
        #stats td:last-child { text-align: right; font-family: monospace; color: #00ffcc; }
        #stats .pass { color: #00ffcc; }
        #stats .fail { color: #ff4444; }
        #stats .info { color: #aaa; }

        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 18px; z-index: 1000;
        }

        .help {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 8px 12px;
            border-radius: 6px; font-size: 11px; color: #bbb; z-index: 100;
        }
        #attribution {
            position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 3px #000; z-index: 100; white-space: nowrap;
        }
        #attribution a { color: inherit; }

        .viewpoint-marker {
            background: rgba(249, 202, 36, 0.9);
            color: #1a1a2e;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #f9ca24;
        }
        .corner-label {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid #666;
        }
        .corner-label.start-finish {
            background: rgba(0, 0, 0, 0.9);
            color: #f9ca24;
            border: 2px solid #f9ca24;
        }
        .layout-direction {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
            font-style: italic;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="loading">Loading site data...</div>
    <div id="canvas-container"></div>

    <div id="controls" class="panel">
        <h2>🗾 Japan Site Scout</h2>
        <label>
            Site
            <select id="site-select"></select>
        </label>
        
        <div class="site-info" id="site-info" style="display: none;">
            <div class="name" id="site-name">-</div>
            <div class="prefecture" id="site-prefecture">-</div>
            <div class="metric">Diameter: <span class="value" id="site-diameter">-</span></div>
            <div class="metric">Relief: <span class="value" id="site-relief">-</span></div>
            <div class="metric">Floor flat: <span class="value" id="site-floor-flat">-</span></div>
            <div class="metric">Rim slopes: <span class="value" id="site-rim-slopes">-</span></div>
        </div>

        <h3>🏎️ Track Layout</h3>
        <label>
            Layout
            <select id="layout-select">
                <option value="">None</option>
            </select>
        </label>
        <div id="layout-direction" class="layout-direction" style="display: none;"></div>

        <h3>📍 Viewpoint</h3>
        <div>
            <button id="btn-best-viewpoint" class="viewpoint">🔭 Best Viewpoint</button>
            <button id="btn-overview" class="secondary">🌐 Overview</button>
        </div>
        <div id="viewpoint-info" style="margin-top: 8px; font-size: 11px; color: #888; display: none;">
            Floor visibility: <span id="viewpoint-visibility" style="color: #00ffcc;">-</span>
        </div>

        <h3>⚙️ Display</h3>
        <label id="exag-label">
            Vert. Exag.
            <input type="range" id="exaggeration" min="1" max="5" step="0.5" value="1.5">
            <span id="exag-value">1.5×</span>
        </label>
        <label><input type="checkbox" id="show-layout" checked> Show layout ribbon</label>
        <label><input type="checkbox" id="show-labels" checked> Show corner labels</label>
    </div>

    <div id="stats" class="panel">
        <h2>Site Metrics</h2>
        <table>
            <tr><td>Center Lat</td><td id="stat-lat">-</td></tr>
            <tr><td>Center Lon</td><td id="stat-lon">-</td></tr>
            <tr><td>Min Elev</td><td id="stat-min-elev">-</td></tr>
            <tr><td>Max Elev</td><td id="stat-max-elev">-</td></tr>
            <tr><td>Relief</td><td id="stat-relief">-</td></tr>
        </table>
        <div id="why-fits" style="margin-top: 12px; font-size: 11px; color: #f9ca24; font-style: italic;"></div>
        
        <div id="layout-stats" style="display: none;">
            <h3>Layout Checks</h3>
            <table id="layout-checks-table"></table>
        </div>
    </div>

    <div class="help" id="help">
        Drag to orbit • Scroll to zoom • Select a site to explore
    </div>
    <div id="attribution"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { Sky } from 'three/addons/objects/Sky.js';

        const params = new URLSearchParams(location.search);
        const SITES_BASE = 'data/sites';

        let scene, camera, renderer, labelRenderer, controls, world, sky, sun;
        let terrainMesh, viewpointMarker, trackGroup;
        let terrain, terrainMeta, sceneData;
        let frame = { lon0: 0, lat0: 0, sx: 111320, sy: 111320 };
        let baseElevation = 0;
        let sitesIndex = [];
        let currentSite = null;
        let currentLayout = null;
        let currentLayoutKey = null;
        let layoutPoints = null;
        let layoutCheckMetrics = null;
        let cornerLabels = [];
        let atViewpoint = false;

        const ORBIT_FOV = 50;
        const SUN_ELEVATION_DEG = 45;
        const SUN_AZIMUTH_DEG = 180;
        const HAZE_COLOR = new THREE.Color(0xc9d8e8);
        const TRACK_WIDTH = 14;
        const RIBBON_OFFSET = 3;
        const TRACK_COLOR = 0x00ccff;
        const OUTLINE_COLOR = 0x111111;

        async function loadBinary(url, Type) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`${url}: ${res.status}`);
            return new Type(await res.arrayBuffer());
        }

        async function loadSitesIndex() {
            try {
                const res = await fetch(`${SITES_BASE}/index.json`);
                const data = await res.json();
                sitesIndex = data.sites || [];
                
                const select = document.getElementById('site-select');
                select.innerHTML = '<option value="">Choose a site...</option>';
                sitesIndex.forEach(site => {
                    const opt = document.createElement('option');
                    opt.value = site.slug;
                    opt.textContent = `${site.name}, ${site.prefecture}`;
                    select.appendChild(opt);
                });
                
                return sitesIndex;
            } catch (e) {
                console.error('Failed to load sites index:', e);
                return [];
            }
        }

        function checkerLayoutMetrics(layoutKey) {
            if (!layoutKey || !layoutCheckMetrics) return null;
            return layoutCheckMetrics[layoutKey] || null;
        }

        function nearestLayoutPointAtDistance(distanceM) {
            if (!layoutPoints?.length) return null;
            let best = layoutPoints[0];
            let bestD = Math.abs(best.distance - distanceM);
            for (const p of layoutPoints) {
                const d = Math.abs(p.distance - distanceM);
                if (d < bestD) {
                    bestD = d;
                    best = p;
                }
            }
            return best;
        }

        async function loadLayoutsIndex(slug) {
            const select = document.getElementById('layout-select');
            select.innerHTML = '<option value="">None</option>';
            layoutCheckMetrics = null;
            
            if (!slug) return [];
            
            try {
                try {
                    const metricsRes = await fetch(`${SITES_BASE}/${slug}/layouts/check_metrics.json`);
                    if (metricsRes.ok) {
                        layoutCheckMetrics = await metricsRes.json();
                    }
                } catch (e) { /* metrics optional until layout_check runs */ }

                const layoutFiles = ['layout_a_straight_hairpin', 'layout_b_elevation_sweep', 'layout_c_arena'];
                const layouts = [];
                
                for (const name of layoutFiles) {
                    try {
                        const res = await fetch(`${SITES_BASE}/${slug}/layouts/${name}.json`);
                        if (res.ok) {
                            const layout = await res.json();
                            layouts.push(layout);
                            const opt = document.createElement('option');
                            opt.value = name;
                            opt.textContent = layout.name || name;
                            select.appendChild(opt);
                        }
                    } catch (e) { }
                }
                
                return layouts;
            } catch (e) {
                console.error('Failed to load layouts:', e);
                return [];
            }
        }

        async function loadSite(slug) {
            if (!slug) return null;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').textContent = `Loading ${slug}...`;
            
            try {
                const [tm, sc] = await Promise.all([
                    fetch(`${SITES_BASE}/${slug}/terrain.json`).then(r => r.json()),
                    fetch(`${SITES_BASE}/${slug}/scene.json`).then(r => r.json()),
                ]);
                terrainMeta = tm;
                sceneData = sc;
                
                const [heights, tex] = await Promise.all([
                    loadBinary(`${SITES_BASE}/${slug}/${terrainMeta.file}`, Float32Array),
                    new THREE.TextureLoader().loadAsync(`${SITES_BASE}/${slug}/${sceneData.imagery.file}`),
                ]);
                
                terrain = {
                    heights, rows: terrainMeta.rows, cols: terrainMeta.cols,
                    left: terrainMeta.left, top: terrainMeta.top,
                    resX: terrainMeta.res_x, resY: terrainMeta.res_y,
                };
                
                frame = {
                    lon0: sceneData.frame.lon0,
                    lat0: sceneData.frame.lat0,
                    sx: 111320 * Math.cos(sceneData.frame.lat0 * Math.PI / 180),
                    sy: 111320,
                };
                
                baseElevation = (terrainMeta.min_elev + terrainMeta.max_elev) / 2;
                
                currentSite = {
                    slug,
                    ...sceneData.site,
                    bestViewpoint: sceneData.best_viewpoint,
                };
                
                rebuildTerrain(tex);
                buildViewpointMarker();
                updateSiteUI();
                setDefaultCamera();
                
                await loadLayoutsIndex(slug);
                
                const requestedLayout = params.get('layout');
                if (requestedLayout) {
                    document.getElementById('layout-select').value = requestedLayout;
                    await loadLayout(requestedLayout);
                } else {
                    clearLayout();
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('attribution').textContent = sceneData.attribution?.join(' · ') || '';
                
                return currentSite;
            } catch (e) {
                console.error(`Failed to load site ${slug}:`, e);
                document.getElementById('loading').textContent = `Error loading ${slug}`;
                return null;
            }
        }

        async function loadLayout(name) {
            if (!name || !currentSite) {
                clearLayout();
                return;
            }
            
            try {
                const res = await fetch(`${SITES_BASE}/${currentSite.slug}/layouts/${name}.json`);
                if (!res.ok) throw new Error(`Layout not found: ${name}`);
                
                currentLayoutKey = name;
                currentLayout = await res.json();
                layoutPoints = interpolateLayout(currentLayout);
                
                buildTrackRibbon();
                buildCornerLabels();
                updateLayoutUI();
                
                document.getElementById('layout-direction').textContent = currentLayout.direction || '';
                document.getElementById('layout-direction').style.display = currentLayout.direction ? 'block' : 'none';
            } catch (e) {
                console.error('Failed to load layout:', e);
                clearLayout();
            }
        }

        function clearLayout() {
            currentLayout = null;
            currentLayoutKey = null;
            layoutPoints = null;
            
            if (trackGroup) {
                world.remove(trackGroup);
                trackGroup = null;
            }
            
            cornerLabels.forEach(l => { if (l.parent) l.parent.remove(l); });
            cornerLabels = [];
            
            document.getElementById('layout-stats').style.display = 'none';
            document.getElementById('layout-direction').style.display = 'none';
        }

        function catmullRomSpline(points, numSamples, closed = true) {
            const n = points.length;
            if (n < 2) return points.slice();
            
            const pts = closed 
                ? [points[n-1], ...points, points[0], points[1]]
                : [points[0], ...points, points[n-1]];
            
            const result = [];
            const numSegments = closed ? n : n - 1;
            const samplesPerSegment = Math.ceil(numSamples / numSegments);
            
            for (let i = 0; i < numSegments; i++) {
                const p0 = pts[i], p1 = pts[i+1], p2 = pts[i+2], p3 = pts[i+3];
                
                const d1 = Math.sqrt((p1.x-p0.x)**2 + (p1.y-p0.y)**2) || 0.001;
                const d2 = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2) || 0.001;
                const d3 = Math.sqrt((p3.x-p2.x)**2 + (p3.y-p2.y)**2) || 0.001;
                
                const t0 = 0;
                const t1 = t0 + Math.pow(d1, 0.5);
                const t2 = t1 + Math.pow(d2, 0.5);
                const t3 = t2 + Math.pow(d3, 0.5);
                
                for (let s = 0; s < samplesPerSegment; s++) {
                    const t = t1 + (t2 - t1) * s / samplesPerSegment;
                    
                    const a1x = (t1 - t) / (t1 - t0) * p0.x + (t - t0) / (t1 - t0) * p1.x;
                    const a1y = (t1 - t) / (t1 - t0) * p0.y + (t - t0) / (t1 - t0) * p1.y;
                    const a2x = (t2 - t) / (t2 - t1) * p1.x + (t - t1) / (t2 - t1) * p2.x;
                    const a2y = (t2 - t) / (t2 - t1) * p1.y + (t - t1) / (t2 - t1) * p2.y;
                    const a3x = (t3 - t) / (t3 - t2) * p2.x + (t - t2) / (t3 - t2) * p3.x;
                    const a3y = (t3 - t) / (t3 - t2) * p2.y + (t - t2) / (t3 - t2) * p3.y;
                    
                    const b1x = (t2 - t) / (t2 - t0) * a1x + (t - t0) / (t2 - t0) * a2x;
                    const b1y = (t2 - t) / (t2 - t0) * a1y + (t - t0) / (t2 - t0) * a2y;
                    const b2x = (t3 - t) / (t3 - t1) * a2x + (t - t1) / (t3 - t1) * a3x;
                    const b2y = (t3 - t) / (t3 - t1) * a2y + (t - t1) / (t3 - t1) * a3y;
                    
                    const cx = (t2 - t) / (t2 - t1) * b1x + (t - t1) / (t2 - t1) * b2x;
                    const cy = (t2 - t) / (t2 - t1) * b1y + (t - t1) / (t2 - t1) * b2y;
                    
                    result.push({ x: cx, y: cy });
                }
            }
            
            return result;
        }

        function sampleTerrain(x, y) {
            const lon = frame.lon0 + x / frame.sx;
            const lat = frame.lat0 + y / frame.sy;
            
            const col = (lon - terrain.left) / terrain.resX - 0.5;
            const row = (terrain.top - lat) / terrain.resY - 0.5;
            
            const c0 = Math.min(Math.max(Math.floor(col), 0), terrain.cols - 2);
            const r0 = Math.min(Math.max(Math.floor(row), 0), terrain.rows - 2);
            const dc = col - c0;
            const dr = row - r0;
            
            const h = terrain.heights;
            const n = terrain.cols;
            return h[r0 * n + c0] * (1-dc) * (1-dr) +
                   h[r0 * n + c0 + 1] * dc * (1-dr) +
                   h[(r0+1) * n + c0] * (1-dc) * dr +
                   h[(r0+1) * n + c0 + 1] * dc * dr;
        }

        function interpolateLayout(layout) {
            const controlPts = layout.control_points.map(p => ({ x: p.x, y: p.y }));
            
            let approxLength = 0;
            for (let i = 0; i < controlPts.length; i++) {
                const j = (i + 1) % controlPts.length;
                approxLength += Math.sqrt((controlPts[j].x - controlPts[i].x)**2 + 
                                          (controlPts[j].y - controlPts[i].y)**2);
            }
            
            const numSamples = Math.max(100, Math.round(approxLength / 2));
            const splinePoints = catmullRomSpline(controlPts, numSamples, true);
            
            const points = splinePoints.map((p, i) => {
                const z = sampleTerrain(p.x, p.y);
                return { x: p.x, y: p.y, z, index: i };
            });
            
            let distance = 0;
            for (let i = 0; i < points.length; i++) {
                if (i > 0) {
                    const dx = points[i].x - points[i-1].x;
                    const dy = points[i].y - points[i-1].y;
                    distance += Math.sqrt(dx*dx + dy*dy);
                }
                points[i].distance = distance;
            }
            
            return points;
        }

        function buildTrackRibbon() {
            if (trackGroup) {
                world.remove(trackGroup);
            }
            trackGroup = new THREE.Group();
            
            if (!layoutPoints || layoutPoints.length < 2) return;
            
            const halfWidth = TRACK_WIDTH / 2;
            const outlineWidth = halfWidth + 2;
            const points = layoutPoints;
            const n = points.length;
            
            const outlineVerts = [], trackVerts = [];
            
            for (let i = 0; i < n; i++) {
                const p = points[i];
                const pPrev = points[(i - 1 + n) % n];
                const pNext = points[(i + 1) % n];
                
                const dx = pNext.x - pPrev.x;
                const dy = pNext.y - pPrev.y;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const nx = -dy / len;
                const ny = dx / len;
                
                const centerZ = p.z;
                const localY = (elev) => elev - baseElevation;
                
                const edge = (w) => {
                    const lx = p.x + nx * w, ly = p.y + ny * w;
                    const rx = p.x - nx * w, ry = p.y - ny * w;
                    const lz = Math.max(sampleTerrain(lx, ly), centerZ);
                    const rz = Math.max(sampleTerrain(rx, ry), centerZ);
                    return [lx, localY(lz) + RIBBON_OFFSET, -ly, rx, localY(rz) + RIBBON_OFFSET, -ry];
                };
                
                const o = edge(outlineWidth);
                outlineVerts.push(o[0], o[1] - 0.3, o[2], o[3], o[4] - 0.3, o[5]);
                trackVerts.push(...edge(halfWidth));
            }
            
            const indices = [];
            for (let i = 0; i < n; i++) {
                const i0 = i * 2, i1 = i * 2 + 1;
                const i2 = ((i + 1) % n) * 2, i3 = ((i + 1) % n) * 2 + 1;
                indices.push(i0, i2, i1, i1, i2, i3);
            }
            
            const overlay = { 
                side: THREE.DoubleSide, 
                depthTest: false, 
                depthWrite: false, 
                transparent: true, 
                fog: false, 
                toneMapped: false 
            };
            
            const outlineGeo = new THREE.BufferGeometry();
            outlineGeo.setAttribute('position', new THREE.Float32BufferAttribute(outlineVerts, 3));
            outlineGeo.setIndex(indices);
            const outlineMesh = new THREE.Mesh(outlineGeo, 
                new THREE.MeshBasicMaterial({ color: OUTLINE_COLOR, opacity: 0.9, ...overlay }));
            outlineMesh.renderOrder = 10;
            trackGroup.add(outlineMesh);
            
            const trackGeo = new THREE.BufferGeometry();
            trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(trackVerts, 3));
            trackGeo.setIndex(indices);
            const trackMesh = new THREE.Mesh(trackGeo, 
                new THREE.MeshBasicMaterial({ color: TRACK_COLOR, opacity: 1.0, ...overlay }));
            trackMesh.renderOrder = 11;
            trackGroup.add(trackMesh);
            
            addStartFinishLine();
            
            trackGroup.visible = document.getElementById('show-layout').checked;
            world.add(trackGroup);
        }

        function addStartFinishLine() {
            if (!layoutPoints || layoutPoints.length < 2) return;
            
            const p0 = layoutPoints[0];
            const p1 = layoutPoints[1];
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const y = p0.z - baseElevation + RIBBON_OFFSET + 0.5;
            
            const geometry = new THREE.PlaneGeometry(TRACK_WIDTH + 4, 3);
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for (let x = 0; x < canvas.width; x += 8) {
                for (let yy = 0; yy < canvas.height; yy += 8) {
                    ctx.fillStyle = ((x + yy) / 8) % 2 === 0 ? '#ffffff' : '#000000';
                    ctx.fillRect(x, yy, 8, 8);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 1);
            
            const overlay = { 
                side: THREE.DoubleSide, 
                depthTest: false, 
                depthWrite: false, 
                transparent: true 
            };
            const sfLine = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture, ...overlay }));
            sfLine.renderOrder = 12;
            sfLine.rotation.x = -Math.PI / 2;
            sfLine.rotation.z = -Math.atan2(dy, dx);
            sfLine.position.set(p0.x, y, -p0.y);
            trackGroup.add(sfLine);
        }

        function buildCornerLabels() {
            cornerLabels.forEach(l => { if (l.parent) l.parent.remove(l); });
            cornerLabels = [];
            
            if (!layoutPoints || !document.getElementById('show-labels').checked) return;
            
            const lift = 15;
            
            const sfLabel = document.createElement('div');
            sfLabel.className = 'corner-label start-finish';
            sfLabel.textContent = '🏁 S/F';
            const sfObj = new CSS2DObject(sfLabel);
            const p0 = layoutPoints[0];
            sfObj.position.set(p0.x, p0.z - baseElevation + lift, -p0.y);
            world.add(sfObj);
            cornerLabels.push(sfObj);
            
            const checker = checkerLayoutMetrics(currentLayoutKey);
            const corners = checker?.corners || [];
            corners.forEach((corner, idx) => {
                const pt = nearestLayoutPointAtDistance(corner.position_m);
                if (!pt) return;
                const label = document.createElement('div');
                label.className = 'corner-label';
                label.textContent = `T${idx + 1}`;
                const labelObj = new CSS2DObject(label);
                labelObj.position.set(pt.x, pt.z - baseElevation + lift, -pt.y);
                world.add(labelObj);
                cornerLabels.push(labelObj);
            });
        }

        function updateLayoutUI() {
            if (!currentLayout || !layoutPoints) {
                document.getElementById('layout-stats').style.display = 'none';
                return;
            }
            
            const n = layoutPoints.length;
            const lastPt = layoutPoints[n-1];
            const firstPt = layoutPoints[0];
            const lapLength = lastPt.distance + Math.sqrt(
                (firstPt.x - lastPt.x)**2 + (firstPt.y - lastPt.y)**2
            );
            
            const elevs = layoutPoints.map(p => p.z);
            const elevRange = Math.max(...elevs) - Math.min(...elevs);
            
            const checker = checkerLayoutMetrics(currentLayoutKey);
            const numCorners = checker?.num_corners;
            const minRadius = checker?.min_radius_m;
            
            let maxGrad = 0;
            for (let i = 1; i < n; i++) {
                const dz = layoutPoints[i].z - layoutPoints[i-1].z;
                const dd = layoutPoints[i].distance - layoutPoints[i-1].distance;
                if (dd > 1) {
                    const grad = Math.abs(dz / dd * 100);
                    if (grad > maxGrad) maxGrad = grad;
                }
            }
            
            const checks = [
                { name: 'Lap length', value: `${(lapLength/1000).toFixed(2)} km`, 
                  pass: lapLength >= 3500 && lapLength <= 4500, target: '3.5-4.5 km' },
                { name: 'Min radius', value: minRadius != null ? `${Number(minRadius).toFixed(1)} m` : '—', 
                  pass: minRadius != null && minRadius >= 15, target: '≥15 m' },
                { name: 'Corners', value: numCorners != null ? numCorners : '—', pass: true, target: 'info' },
                { name: 'Max gradient', value: `${maxGrad.toFixed(1)}%`, 
                  pass: maxGrad <= 12, target: '≤12%' },
                { name: 'Elev range', value: `${elevRange.toFixed(0)} m`, 
                  pass: true, target: 'info' },
            ];
            
            const table = document.getElementById('layout-checks-table');
            table.innerHTML = checks.map(c => {
                const cls = c.target === 'info' ? 'info' : (c.pass ? 'pass' : 'fail');
                const icon = c.target === 'info' ? '' : (c.pass ? '✓' : '✗');
                return `<tr><td>${c.name}</td><td class="${cls}">${icon} ${c.value}</td></tr>`;
            }).join('');
            
            document.getElementById('layout-stats').style.display = 'block';
        }

        function rebuildTerrain(imagery) {
            if (terrainMesh) {
                world.remove(terrainMesh);
                terrainMesh.geometry.dispose();
                terrainMesh.material.dispose();
            }
            
            const { rows, cols, left, top, resX, resY, heights } = terrain;
            const [iw, is, ie, inn] = sceneData.imagery.bbox;
            
            const positions = new Float32Array(rows * cols * 3);
            const uvs = new Float32Array(rows * cols * 2);
            
            for (let i = 0; i < rows; i++) {
                const lat = top - (i + 0.5) * resY;
                for (let j = 0; j < cols; j++) {
                    const lon = left + (j + 0.5) * resX;
                    const k = i * cols + j;
                    const x = (lon - frame.lon0) * frame.sx;
                    const y = heights[k] - baseElevation;
                    const z = -(lat - frame.lat0) * frame.sy;
                    positions[k * 3] = x;
                    positions[k * 3 + 1] = y;
                    positions[k * 3 + 2] = z;
                    uvs[k * 2] = (lon - iw) / (ie - iw);
                    uvs[k * 2 + 1] = (lat - is) / (inn - is);
                }
            }
            
            const indices = [];
            for (let i = 0; i < rows - 1; i++) {
                for (let j = 0; j < cols - 1; j++) {
                    const a = i * cols + j, b = (i + 1) * cols + j, c = a + 1, d = b + 1;
                    indices.push(a, b, c, b, d, c);
                }
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            imagery.colorSpace = THREE.SRGBColorSpace;
            imagery.anisotropy = renderer.capabilities.getMaxAnisotropy();
            
            const material = new THREE.MeshLambertMaterial({ map: imagery, color: 0xffffff });
            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.receiveShadow = true;
            world.add(terrainMesh);
            
            renderer.shadowMap.needsUpdate = true;
        }

        function buildViewpointMarker() {
            if (viewpointMarker) {
                world.remove(viewpointMarker);
            }
            
            if (!currentSite?.bestViewpoint) return;
            
            const vp = currentSite.bestViewpoint;
            const x = (vp.lon - frame.lon0) * frame.sx;
            const y = vp.elevation_m - baseElevation + 5;
            const z = -(vp.lat - frame.lat0) * frame.sy;
            
            const group = new THREE.Group();
            
            const mat = new THREE.MeshStandardMaterial({ color: 0xf9ca24, emissive: 0x443300 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10, 8), mat);
            pole.position.y = 5;
            group.add(pole);
            
            const eye = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 12),
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x666666 }));
            eye.position.y = 12;
            group.add(eye);
            
            const label = document.createElement('div');
            label.className = 'viewpoint-marker';
            label.textContent = `Best VP: ${vp.visibility_pct?.toFixed(0) || '?'}% visible`;
            const labelObj = new CSS2DObject(label);
            labelObj.position.y = 18;
            group.add(labelObj);
            
            group.position.set(x, y, z);
            viewpointMarker = group;
            world.add(viewpointMarker);
        }

        function updateSiteUI() {
            if (!currentSite) return;
            
            document.getElementById('site-info').style.display = 'block';
            document.getElementById('site-name').textContent = currentSite.name || currentSite.slug;
            document.getElementById('site-prefecture').textContent = currentSite.prefecture || '';
            
            const m = currentSite.metrics || {};
            document.getElementById('site-diameter').textContent = m.diameter_m ? `${m.diameter_m.toFixed(0)}m` : '-';
            document.getElementById('site-relief').textContent = m.relief_m ? `${m.relief_m.toFixed(0)}m` : '-';
            document.getElementById('site-floor-flat').textContent = m.floor_flat_pct ? `${m.floor_flat_pct.toFixed(0)}%` : '-';
            
            const slopes = m.rim_slope_range;
            document.getElementById('site-rim-slopes').textContent = slopes ? 
                `${slopes[0].toFixed(0)}° - ${slopes[1].toFixed(0)}°` : '-';
            
            document.getElementById('stat-lat').textContent = currentSite.lat?.toFixed(4) || '-';
            document.getElementById('stat-lon').textContent = currentSite.lon?.toFixed(4) || '-';
            document.getElementById('stat-min-elev').textContent = `${terrainMeta.min_elev.toFixed(0)}m`;
            document.getElementById('stat-max-elev').textContent = `${terrainMeta.max_elev.toFixed(0)}m`;
            document.getElementById('stat-relief').textContent = m.relief_m ? `${m.relief_m.toFixed(0)}m` : '-';
            
            document.getElementById('why-fits').textContent = currentSite.why_it_fits || '';
            
            document.getElementById('site-select').value = currentSite.slug;
            document.title = `Track Lab - ${currentSite.name || currentSite.slug}`;
        }

        function sunDirection() {
            const el = THREE.MathUtils.degToRad(SUN_ELEVATION_DEG);
            const az = THREE.MathUtils.degToRad(SUN_AZIMUTH_DEG);
            return new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
        }

        function buildSkyAndLights() {
            sky = new Sky();
            sky.scale.setScalar(45000);
            const u = sky.material.uniforms;
            u.turbidity.value = 4;
            u.rayleigh.value = 1.1;
            u.mieCoefficient.value = 0.004;
            u.mieDirectionalG.value = 0.8;
            u.sunPosition.value.copy(sunDirection());
            scene.add(sky);

            scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x4d5a36, 1.3));

            sun = new THREE.DirectionalLight(0xfff0dd, 3.2);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.bias = -0.0004;
            scene.add(sun);
            scene.add(sun.target);
        }

        function setShadowArea(center, halfSize) {
            const cam = sun.shadow.camera;
            cam.left = cam.bottom = -halfSize;
            cam.right = cam.top = halfSize;
            cam.near = 10;
            cam.far = 8000;
            cam.updateProjectionMatrix();
            sun.target.position.copy(center);
            sun.position.copy(center).addScaledVector(sunDirection(), 3000);
            sun.target.updateMatrixWorld();
            renderer.shadowMap.needsUpdate = true;
        }

        function setDefaultCamera() {
            if (!terrain) return;
            
            const { rows, cols, left, top, resX, resY, heights } = terrain;
            
            let minX = Infinity, maxX = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            
            for (let i = 0; i < rows; i++) {
                const lat = top - (i + 0.5) * resY;
                for (let j = 0; j < cols; j++) {
                    const lon = left + (j + 0.5) * resX;
                    const x = (lon - frame.lon0) * frame.sx;
                    const z = -(lat - frame.lat0) * frame.sy;
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                    minZ = Math.min(minZ, z);
                    maxZ = Math.max(maxZ, z);
                }
            }
            
            const centerX = (minX + maxX) / 2;
            const centerZ = (minZ + maxZ) / 2;
            const size = Math.max(maxX - minX, maxZ - minZ);
            const dist = size * 1.2;
            
            camera.position.set(centerX + dist * 0.6, dist * 0.5, centerZ + dist * 0.6);
            controls.target.set(centerX, 0, centerZ);
            controls.update();
            
            setShadowArea(new THREE.Vector3(centerX, 0, centerZ), size);
            
            atViewpoint = false;
            document.getElementById('viewpoint-info').style.display = 'none';
        }

        function goToViewpoint() {
            if (!currentSite?.bestViewpoint) return;
            
            const vp = currentSite.bestViewpoint;
            const x = (vp.lon - frame.lon0) * frame.sx;
            const y = vp.elevation_m - baseElevation + 2;
            const z = -(vp.lat - frame.lat0) * frame.sy;
            
            camera.position.set(x, y + 50, z + 50);
            controls.target.set(0, baseElevation - terrainMeta.min_elev, 0);
            controls.update();
            
            atViewpoint = true;
            document.getElementById('viewpoint-info').style.display = 'block';
            document.getElementById('viewpoint-visibility').textContent = 
                `${vp.visibility_pct?.toFixed(1) || '?'}%`;
        }

        async function init() {
            await loadSitesIndex();
            
            const requestedSite = params.get('site');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(HAZE_COLOR, 0.00008);

            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(ORBIT_FOV, container.clientWidth / container.clientHeight, 1, 50000);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: params.has('capture') });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.75;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxDistance = 5000;
            controls.minDistance = 50;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;

            world = new THREE.Group();
            scene.add(world);
            world.scale.y = 1.5;

            buildSkyAndLights();
            setupControls();

            window.addEventListener('resize', onResize);

            if (requestedSite) {
                await loadSite(requestedSite);
            } else if (sitesIndex.length > 0) {
                await loadSite(sitesIndex[0].slug);
            } else {
                document.getElementById('loading').textContent = 'No sites available';
            }

            animate();
            window.__ready = true;
        }

        function setupControls() {
            const exagSlider = document.getElementById('exaggeration');
            exagSlider.addEventListener('input', () => {
                world.scale.y = parseFloat(exagSlider.value);
                document.getElementById('exag-value').textContent = exagSlider.value + '×';
                renderer.shadowMap.needsUpdate = true;
            });
            
            document.getElementById('site-select').addEventListener('change', async (e) => {
                if (e.target.value) {
                    await loadSite(e.target.value);
                    history.replaceState(null, '', `?site=${e.target.value}`);
                }
            });
            
            document.getElementById('layout-select').addEventListener('change', async (e) => {
                await loadLayout(e.target.value);
                if (e.target.value) {
                    const url = new URL(location);
                    url.searchParams.set('layout', e.target.value);
                    history.replaceState(null, '', url);
                }
            });
            
            document.getElementById('show-layout').addEventListener('change', (e) => {
                if (trackGroup) trackGroup.visible = e.target.checked;
            });
            
            document.getElementById('show-labels').addEventListener('change', (e) => {
                cornerLabels.forEach(l => l.visible = e.target.checked);
            });
            
            document.getElementById('btn-best-viewpoint').addEventListener('click', goToViewpoint);
            document.getElementById('btn-overview').addEventListener('click', setDefaultCamera);
        }

        function onResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            sky.position.copy(camera.position);
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
