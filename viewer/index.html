<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Lab - Red Bull Ring</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 280px;
            z-index: 100;
        }
        #controls h2 { margin-bottom: 10px; font-size: 16px; color: #ff6b6b; }
        #controls h3 {
            margin-top: 12px; margin-bottom: 8px; font-size: 13px;
            color: #4ecdc4; border-top: 1px solid #333; padding-top: 10px;
        }
        #controls label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        #controls input[type="range"] { flex: 1; accent-color: #ff6b6b; }
        #controls input[type="checkbox"] { accent-color: #ff6b6b; }
        #controls select {
            flex: 1; background: #333; color: #eee;
            border: 1px solid #555; padding: 5px; border-radius: 4px;
        }
        #controls button {
            background: #4ecdc4; color: #1a1a2e; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            margin: 3px 2px; font-size: 12px; font-weight: 500;
        }
        #controls button:hover { background: #3dbdb5; }
        #controls button.secondary { background: #444; color: #eee; }
        #controls button.secondary:hover { background: #555; }
        
        .seat-info {
            background: rgba(78, 205, 196, 0.15);
            border: 1px solid #4ecdc4;
            border-radius: 4px; padding: 8px; margin: 8px 0; font-size: 12px;
        }
        .seat-info .name { font-weight: bold; color: #4ecdc4; }
        
        .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-box { width: 14px; height: 8px; border-radius: 2px; }
        .legend-visible { background: #00ffcc; }
        .legend-hidden { background: #ff4444; }
        
        #stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 260px;
            z-index: 100;
        }
        #stats h2 { margin-bottom: 10px; font-size: 16px; color: #4ecdc4; }
        #stats h3 {
            margin-top: 12px; margin-bottom: 6px; font-size: 13px;
            color: #f9ca24; border-top: 1px solid #333; padding-top: 8px;
        }
        #stats table { width: 100%; border-collapse: collapse; }
        #stats td { padding: 2px 0; }
        #stats td:first-child { color: #888; }
        #stats td:last-child { text-align: right; font-family: monospace; }
        .visible-stat { color: #00ffcc !important; font-weight: bold; }
        .hidden-stat { color: #ff4444 !important; }
        
        #corners ul { list-style: none; font-size: 11px; max-height: 120px; overflow-y: auto; }
        #corners li { padding: 2px 0; font-family: monospace; }
        #corners li.visible { color: #00ffcc; }
        #corners li.hidden { color: #666; }
        
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 18px; z-index: 1000;
        }
        
        .help {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 8px 12px;
            border-radius: 6px; font-size: 11px; color: #888;
        }
        
        /* 2D Minimap */
        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            z-index: 100;
            overflow: hidden;
        }
        #minimap-canvas { width: 100%; height: 100%; }
        #minimap-label {
            position: absolute; top: 4px; left: 8px;
            font-size: 10px; color: #888; text-transform: uppercase;
        }
        
        /* Corner labels (CSS2D) */
        .corner-label {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid #666;
        }
        .corner-label.visible { border-color: #00ffcc; color: #00ffcc; }
        .corner-label.hidden { border-color: #ff4444; color: #ff4444; opacity: 0.7; }
        .corner-label.start-finish {
            background: rgba(0, 0, 0, 0.9);
            color: #f9ca24;
            border: 2px solid #f9ca24;
            font-size: 11px;
            padding: 3px 8px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading track data...</div>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>🏎️ Red Bull Ring</h2>
        <label>
            <input type="checkbox" id="show-terrain" checked> Terrain
        </label>
        <label>
            <input type="checkbox" id="show-track" checked> Track
        </label>
        <label>
            <input type="checkbox" id="show-labels" checked> Corner Labels
        </label>
        <label>
            Vert. Exag.
            <input type="range" id="exaggeration" min="1" max="5" step="0.5" value="1.5">
            <span id="exag-value">1.5×</span>
        </label>
        
        <h3>👁️ Grandstand View</h3>
        <label>
            Seat
            <select id="seat-select">
                <option value="">Click to place...</option>
            </select>
        </label>
        <label>
            Eye Height
            <input type="range" id="eye-height" min="2" max="30" step="1" value="10">
            <span id="eye-height-value">10m</span>
        </label>
        <div class="seat-info" id="seat-info" style="display: none;">
            <div class="name" id="seat-name">-</div>
            <div id="seat-coords">-</div>
        </div>
        <div>
            <button id="btn-eye-view">📷 Eye View</button>
            <button id="btn-orbit-view" class="secondary">🌐 Reset View</button>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-box legend-visible"></div> Visible</div>
            <div class="legend-item"><div class="legend-box legend-hidden"></div> Hidden</div>
        </div>
    </div>
    
    <div id="stats">
        <h2>Track Statistics</h2>
        <table>
            <tr><td>Length</td><td id="stat-length">-</td></tr>
            <tr><td>Elevation Range</td><td id="stat-elev-range">-</td></tr>
            <tr><td>Max Uphill</td><td id="stat-max-up">-</td></tr>
            <tr><td>Max Downhill</td><td id="stat-max-down">-</td></tr>
        </table>
        
        <h3>👁️ Visibility</h3>
        <table>
            <tr><td>Visible</td><td id="stat-visible-pct" class="visible-stat">-</td></tr>
            <tr><td>Hidden</td><td id="stat-hidden-pct" class="hidden-stat">-</td></tr>
        </table>
        
        <div id="corners">
            <h3>Corners</h3>
            <ul id="corners-list"></ul>
        </div>
    </div>
    
    <div id="minimap">
        <div id="minimap-label">Track Map</div>
        <canvas id="minimap-canvas"></canvas>
    </div>
    
    <div class="help">
        Drag to orbit • Scroll to zoom • Click terrain to place seat
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls;
        let terrainMesh, trackGroup, seatMarker;
        let terrainData, trackData;
        let baseElevation = 0;
        let currentSeat = null;
        let currentVisibility = null;
        let raycaster, mouse;
        let cornerLabels = [];
        let trackBbox = { minX: 0, maxX: 0, minY: 0, maxY: 0, centerX: 0, centerY: 0 };
        let animatingCamera = false;

        const TRACK_MARGIN = 400;
        const TRACK_WIDTH = 14;
        const RIBBON_OFFSET = 5;
        const VISIBLE_COLOR = 0x00ffcc;
        const HIDDEN_COLOR = 0xff4444;
        const OUTLINE_COLOR = 0x111111;

        async function init() {
            try {
                const [terrainRes, trackRes] = await Promise.all([
                    fetch('data/terrain.json'),
                    fetch('data/track.json')
                ]);
                terrainData = await terrainRes.json();
                trackData = await trackRes.json();
            } catch (e) {
                document.getElementById('loading').textContent = 
                    'Error loading data. Run: make viewer-data';
                console.error(e);
                return;
            }

            document.getElementById('loading').style.display = 'none';
            
            computeTrackBbox();
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                50, container.clientWidth / container.clientHeight, 1, 20000
            );
            
            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
            
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxDistance = 4000;
            controls.minDistance = 200;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;
            
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            
            const sun = new THREE.DirectionalLight(0xffeedd, 0.8);
            sun.position.set(500, 1000, 300);
            scene.add(sun);
            
            const fill = new THREE.DirectionalLight(0xaaccff, 0.3);
            fill.position.set(-300, 500, -200);
            scene.add(fill);
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            baseElevation = (terrainData.grid.min_elev + terrainData.grid.max_elev) / 2;
            
            buildTerrain();
            buildTrack();
            buildCornerLabels();
            populateSeatSelector();
            updateStats();
            drawMinimap();
            
            if (trackData.preset_seats && trackData.preset_seats.length > 0) {
                selectSeat(trackData.preset_seats[0]);
            }
            
            setDefaultCamera();
            setupControls();
            
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('click', onCanvasClick);
            
            animate();
        }

        function computeTrackBbox() {
            const points = trackData.points;
            trackBbox.minX = Math.min(...points.map(p => p.x));
            trackBbox.maxX = Math.max(...points.map(p => p.x));
            trackBbox.minY = Math.min(...points.map(p => p.y));
            trackBbox.maxY = Math.max(...points.map(p => p.y));
            trackBbox.centerX = (trackBbox.minX + trackBbox.maxX) / 2;
            trackBbox.centerY = (trackBbox.minY + trackBbox.maxY) / 2;
            trackBbox.width = trackBbox.maxX - trackBbox.minX;
            trackBbox.height = trackBbox.maxY - trackBbox.minY;
        }

        function setDefaultCamera() {
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const size = Math.max(trackBbox.width, trackBbox.height);
            const dist = size * 1.2;
            
            const avgZ = trackData.points.reduce((s, p) => s + p.z, 0) / trackData.points.length;
            const centerY = (avgZ - baseElevation) * exag;
            
            camera.position.set(
                trackBbox.centerX + dist * 0.6,
                centerY + dist * 0.7,
                -trackBbox.centerY + dist * 0.6
            );
            controls.target.set(trackBbox.centerX, centerY, -trackBbox.centerY);
            controls.update();
        }

        function sampleTerrainHeight(worldX, worldY, fallbackZ = null) {
            const { rows, cols } = terrainData.grid;
            const { width, height } = terrainData.size_m;
            
            const u = (worldX + width / 2) / width;
            const v = (worldY + height / 2) / height;
            
            if (u < 0 || u > 1 || v < 0 || v > 1) {
                return fallbackZ !== null ? fallbackZ : baseElevation;
            }
            
            const col = u * (cols - 1);
            const row = (1 - v) * (rows - 1);
            
            const col0 = Math.max(0, Math.min(cols - 2, Math.floor(col)));
            const row0 = Math.max(0, Math.min(rows - 2, Math.floor(row)));
            const col1 = col0 + 1;
            const row1 = row0 + 1;
            
            const dc = col - col0;
            const dr = row - row0;
            
            const heights = terrainData.heights;
            const e00 = heights[row0][col0];
            const e01 = heights[row0][col1];
            const e10 = heights[row1][col0];
            const e11 = heights[row1][col1];
            
            return e00 * (1 - dc) * (1 - dr) +
                   e01 * dc * (1 - dr) +
                   e10 * (1 - dc) * dr +
                   e11 * dc * dr;
        }

        function buildTerrain() {
            const { rows, cols } = terrainData.grid;
            const { width, height } = terrainData.size_m;
            const heights = terrainData.heights;
            const exag = parseFloat(document.getElementById('exaggeration').value);
            
            const clipMinX = trackBbox.minX - TRACK_MARGIN;
            const clipMaxX = trackBbox.maxX + TRACK_MARGIN;
            const clipMinY = trackBbox.minY - TRACK_MARGIN;
            const clipMaxY = trackBbox.maxY + TRACK_MARGIN;
            
            const clipWidth = clipMaxX - clipMinX;
            const clipHeight = clipMaxY - clipMinY;
            
            const uMin = (clipMinX + width / 2) / width;
            const uMax = (clipMaxX + width / 2) / width;
            const vMin = (clipMinY + height / 2) / height;
            const vMax = (clipMaxY + height / 2) / height;
            
            const colStart = Math.max(0, Math.floor(uMin * (cols - 1)));
            const colEnd = Math.min(cols - 1, Math.ceil(uMax * (cols - 1)));
            const rowStart = Math.max(0, Math.floor((1 - vMax) * (rows - 1)));
            const rowEnd = Math.min(rows - 1, Math.ceil((1 - vMin) * (rows - 1)));
            
            const subCols = colEnd - colStart + 1;
            const subRows = rowEnd - rowStart + 1;
            
            const geometry = new THREE.PlaneGeometry(clipWidth, clipHeight, subCols - 1, subRows - 1);
            const positions = geometry.attributes.position.array;
            
            let minElev = Infinity, maxElev = -Infinity;
            for (let i = 0; i < subRows; i++) {
                for (let j = 0; j < subCols; j++) {
                    const srcRow = rowStart + i;
                    const srcCol = colStart + j;
                    const elev = heights[srcRow][srcCol];
                    minElev = Math.min(minElev, elev);
                    maxElev = Math.max(maxElev, elev);
                }
            }
            
            const colors = new Float32Array(subRows * subCols * 3);
            const range = maxElev - minElev || 1;
            
            for (let i = 0; i < subRows; i++) {
                for (let j = 0; j < subCols; j++) {
                    const idx = i * subCols + j;
                    const vertIdx = idx * 3;
                    const srcRow = rowStart + (subRows - 1 - i);
                    const srcCol = colStart + j;
                    const elev = heights[srcRow][srcCol];
                    
                    positions[vertIdx + 2] = (elev - baseElevation) * exag;
                    
                    const t = (elev - minElev) / range;
                    const slopeShade = 0.6 + 0.4 * (1 - t);
                    const baseHue = 0.22;
                    const baseSat = 0.25;
                    const baseLit = 0.25 + t * 0.15;
                    
                    const color = new THREE.Color();
                    color.setHSL(baseHue, baseSat, baseLit * slopeShade);
                    colors[idx * 3] = color.r;
                    colors[idx * 3 + 1] = color.g;
                    colors[idx * 3 + 2] = color.b;
                }
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshLambertMaterial({
                vertexColors: true,
                side: THREE.DoubleSide
            });
            
            if (terrainMesh) scene.remove(terrainMesh);
            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.x = -Math.PI / 2;
            
            const centerX = (clipMinX + clipMaxX) / 2;
            const centerY = (clipMinY + clipMaxY) / 2;
            terrainMesh.position.set(centerX, 0, -centerY);
            terrainMesh.renderOrder = 0;
            
            scene.add(terrainMesh);
        }

        function densifyPoints(points, maxSpacing = 5) {
            const dense = [];
            for (let i = 0; i < points.length; i++) {
                const p0 = points[i];
                const p1 = points[(i + 1) % points.length];
                
                const dx = p1.x - p0.x;
                const dy = p1.y - p0.y;
                const dz = p1.z - p0.z;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const steps = Math.max(1, Math.ceil(dist / maxSpacing));
                
                for (let s = 0; s < steps; s++) {
                    const t = s / steps;
                    dense.push({
                        x: p0.x + dx * t,
                        y: p0.y + dy * t,
                        z: p0.z + dz * t,
                        origIdx: i,
                        t: t
                    });
                }
            }
            return dense;
        }

        function buildTrack() {
            if (trackGroup) scene.remove(trackGroup);
            trackGroup = new THREE.Group();
            
            const points = trackData.points;
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const halfWidth = TRACK_WIDTH / 2;
            const outlineWidth = TRACK_WIDTH / 2 + 2;
            
            const densePoints = densifyPoints(points, 8);
            
            const outlineVerts = [];
            const trackVerts = [];
            const trackColors = [];
            
            for (let i = 0; i < densePoints.length; i++) {
                const dp = densePoints[i];
                const dpPrev = densePoints[(i - 1 + densePoints.length) % densePoints.length];
                const dpNext = densePoints[(i + 1) % densePoints.length];
                
                const dx = dpNext.x - dpPrev.x;
                const dy = dpNext.y - dpPrev.y;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const nx = -dy / len;
                const ny = dx / len;
                
                const centerElev = sampleTerrainHeight(dp.x, dp.y, dp.z);
                const ribbonY = (centerElev - baseElevation) * exag + RIBBON_OFFSET;
                
                const leftX = dp.x + nx * outlineWidth;
                const leftY = dp.y + ny * outlineWidth;
                const rightX = dp.x - nx * outlineWidth;
                const rightY = dp.y - ny * outlineWidth;
                
                const leftElev = sampleTerrainHeight(leftX, leftY, centerElev);
                const rightElev = sampleTerrainHeight(rightX, rightY, centerElev);
                const leftRibbonY = (Math.max(leftElev, centerElev) - baseElevation) * exag + RIBBON_OFFSET;
                const rightRibbonY = (Math.max(rightElev, centerElev) - baseElevation) * exag + RIBBON_OFFSET;
                
                outlineVerts.push(
                    leftX, leftRibbonY - 0.3, -leftY,
                    rightX, rightRibbonY - 0.3, -rightY
                );
                
                const trackLeftX = dp.x + nx * halfWidth;
                const trackLeftY = dp.y + ny * halfWidth;
                const trackRightX = dp.x - nx * halfWidth;
                const trackRightY = dp.y - ny * halfWidth;
                
                const trackLeftElev = sampleTerrainHeight(trackLeftX, trackLeftY, centerElev);
                const trackRightElev = sampleTerrainHeight(trackRightX, trackRightY, centerElev);
                const trackLeftRibbonY = (Math.max(trackLeftElev, centerElev) - baseElevation) * exag + RIBBON_OFFSET;
                const trackRightRibbonY = (Math.max(trackRightElev, centerElev) - baseElevation) * exag + RIBBON_OFFSET;
                
                trackVerts.push(
                    trackLeftX, trackLeftRibbonY, -trackLeftY,
                    trackRightX, trackRightRibbonY, -trackRightY
                );
                
                const origIdx = dp.origIdx;
                const visible = currentVisibility ? currentVisibility[origIdx] : true;
                const color = visible ? new THREE.Color(VISIBLE_COLOR) : new THREE.Color(HIDDEN_COLOR);
                trackColors.push(color.r, color.g, color.b);
                trackColors.push(color.r, color.g, color.b);
            }
            
            const indices = [];
            const n = densePoints.length;
            for (let i = 0; i < n; i++) {
                const i0 = i * 2;
                const i1 = i * 2 + 1;
                const i2 = ((i + 1) % n) * 2;
                const i3 = ((i + 1) % n) * 2 + 1;
                
                indices.push(i0, i2, i1);
                indices.push(i1, i2, i3);
            }
            
            const outlineGeo = new THREE.BufferGeometry();
            outlineGeo.setAttribute('position', new THREE.Float32BufferAttribute(outlineVerts, 3));
            outlineGeo.setIndex(indices);
            outlineGeo.computeVertexNormals();
            
            const outlineMat = new THREE.MeshBasicMaterial({ 
                color: OUTLINE_COLOR, 
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false,
                transparent: true,
                opacity: 0.9
            });
            const outlineMesh = new THREE.Mesh(outlineGeo, outlineMat);
            outlineMesh.renderOrder = 10;
            trackGroup.add(outlineMesh);
            
            const trackGeo = new THREE.BufferGeometry();
            trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(trackVerts, 3));
            trackGeo.setAttribute('color', new THREE.Float32BufferAttribute(trackColors, 3));
            trackGeo.setIndex(indices);
            trackGeo.computeVertexNormals();
            
            const trackMat = new THREE.MeshBasicMaterial({ 
                vertexColors: true, 
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false,
                transparent: true,
                opacity: 1.0
            });
            const trackMesh = new THREE.Mesh(trackGeo, trackMat);
            trackMesh.renderOrder = 11;
            trackGroup.add(trackMesh);
            
            addStartFinishLine(exag);
            
            scene.add(trackGroup);
        }

        function addStartFinishLine(exag) {
            const points = trackData.points;
            const p0 = points[0];
            const p1 = points[1];
            
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;
            
            const terrainElev = sampleTerrainHeight(p0.x, p0.y);
            const z = (terrainElev - baseElevation) * exag + RIBBON_OFFSET + 0.5;
            const lineWidth = TRACK_WIDTH + 4;
            const lineDepth = 3;
            
            const geometry = new THREE.PlaneGeometry(lineWidth, lineDepth);
            
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const squareSize = 8;
            for (let x = 0; x < canvas.width; x += squareSize) {
                for (let y = 0; y < canvas.height; y += squareSize) {
                    ctx.fillStyle = ((x + y) / squareSize) % 2 === 0 ? '#ffffff' : '#000000';
                    ctx.fillRect(x, y, squareSize, squareSize);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 1);
            
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false,
                transparent: true
            });
            
            const sfLine = new THREE.Mesh(geometry, material);
            sfLine.renderOrder = 12;
            
            const angle = Math.atan2(dy, dx);
            sfLine.rotation.x = -Math.PI / 2;
            sfLine.rotation.z = -angle;
            sfLine.position.set(p0.x, z, -p0.y);
            
            trackGroup.add(sfLine);
        }

        function buildCornerLabels() {
            cornerLabels.forEach(label => {
                if (label.parent) label.parent.remove(label);
            });
            cornerLabels = [];
            
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const corners = trackData.corners;
            const points = trackData.points;
            
            const sfLabel = document.createElement('div');
            sfLabel.className = 'corner-label start-finish';
            sfLabel.textContent = '🏁 S/F';
            const sfObj = new CSS2DObject(sfLabel);
            const p0 = points[0];
            const sfTerrainElev = sampleTerrainHeight(p0.x, p0.y);
            sfObj.position.set(p0.x, (sfTerrainElev - baseElevation) * exag + 25, -p0.y);
            scene.add(sfObj);
            cornerLabels.push(sfObj);
            
            const sortedCorners = [...corners]
                .map((c, i) => ({ ...c, originalIndex: i }))
                .sort((a, b) => a.position_m - b.position_m);
            
            sortedCorners.forEach((corner, displayIdx) => {
                let closest = points[0];
                let minDist = Math.abs(points[0].distance - corner.position_m);
                for (const p of points) {
                    const d = Math.abs(p.distance - corner.position_m);
                    if (d < minDist) {
                        minDist = d;
                        closest = p;
                    }
                }
                
                const visible = isCornerVisible(corner);
                
                const label = document.createElement('div');
                label.className = `corner-label ${visible ? 'visible' : 'hidden'}`;
                label.textContent = `T${displayIdx + 1}`;
                
                const labelObj = new CSS2DObject(label);
                const terrainElev = sampleTerrainHeight(closest.x, closest.y);
                labelObj.position.set(
                    closest.x,
                    (terrainElev - baseElevation) * exag + 20,
                    -closest.y
                );
                labelObj.userData = { corner, displayIdx };
                
                scene.add(labelObj);
                cornerLabels.push(labelObj);
            });
        }

        function isCornerVisible(corner) {
            if (!currentVisibility || !currentSeat) return true;
            
            const points = trackData.points;
            let closestIdx = 0;
            let minDist = Math.abs(points[0].distance - corner.position_m);
            for (let i = 0; i < points.length; i++) {
                const d = Math.abs(points[i].distance - corner.position_m);
                if (d < minDist) {
                    minDist = d;
                    closestIdx = i;
                }
            }
            
            const window = 5;
            let visibleCount = 0;
            let totalCount = 0;
            for (let i = Math.max(0, closestIdx - window); i < Math.min(points.length, closestIdx + window + 1); i++) {
                totalCount++;
                if (currentVisibility[i]) visibleCount++;
            }
            
            return visibleCount >= totalCount * 0.5;
        }

        function buildSeatMarker() {
            if (seatMarker) scene.remove(seatMarker);
            if (!currentSeat) return;
            
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const group = new THREE.Group();
            
            const terrainElev = sampleTerrainHeight(currentSeat.x, currentSeat.y);
            
            const baseGeo = new THREE.CylinderGeometry(6, 10, 3, 16);
            const baseMat = new THREE.MeshPhongMaterial({ color: 0xf9ca24, emissive: 0x443300 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 1.5;
            group.add(base);
            
            const poleHeight = Math.max(5, currentSeat.eye_height_m * exag * 0.5);
            const poleGeo = new THREE.CylinderGeometry(1.5, 1.5, poleHeight, 8);
            const poleMat = new THREE.MeshPhongMaterial({ color: 0xf9ca24 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = poleHeight / 2 + 3;
            group.add(pole);
            
            const eyeGeo = new THREE.SphereGeometry(5, 16, 16);
            const eyeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.y = poleHeight + 5;
            group.add(eye);
            
            group.position.set(
                currentSeat.x,
                (terrainElev - baseElevation) * exag,
                -currentSeat.y
            );
            
            seatMarker = group;
            scene.add(seatMarker);
        }

        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            
            const w = rect.width;
            const h = rect.height;
            const padding = 15;
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            const points = trackData.points;
            const scaleX = (w - padding * 2) / trackBbox.width;
            const scaleY = (h - padding * 2) / trackBbox.height;
            const scale = Math.min(scaleX, scaleY);
            
            const offsetX = (w - trackBbox.width * scale) / 2;
            const offsetY = (h - trackBbox.height * scale) / 2;
            
            function toCanvas(p) {
                return {
                    x: offsetX + (p.x - trackBbox.minX) * scale,
                    y: offsetY + (trackBbox.maxY - p.y) * scale
                };
            }
            
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            for (let i = 0; i < points.length; i++) {
                const p0 = toCanvas(points[i]);
                const p1 = toCanvas(points[(i + 1) % points.length]);
                
                const visible = currentVisibility ? currentVisibility[i] : true;
                ctx.strokeStyle = visible ? '#00ffcc' : '#ff4444';
                
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.stroke();
            }
            
            const sf = toCanvas(points[0]);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sf.x, sf.y, 4, 0, Math.PI * 2);
            ctx.fill();
            
            if (currentSeat) {
                const seatPos = toCanvas({ x: currentSeat.x, y: currentSeat.y });
                ctx.fillStyle = '#f9ca24';
                ctx.beginPath();
                ctx.arc(seatPos.x, seatPos.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function populateSeatSelector() {
            const select = document.getElementById('seat-select');
            select.innerHTML = '<option value="">Click to place...</option>';
            
            if (trackData.preset_seats) {
                trackData.preset_seats.forEach(seat => {
                    const opt = document.createElement('option');
                    opt.value = seat.id;
                    opt.textContent = `${seat.name} (${seat.visible_pct.toFixed(1)}%)`;
                    select.appendChild(opt);
                });
            }
        }

        function selectSeat(seat) {
            currentSeat = seat;
            currentVisibility = seat.visibility || null;
            
            const select = document.getElementById('seat-select');
            select.value = seat.id || '';
            
            document.getElementById('eye-height').value = seat.eye_height_m;
            document.getElementById('eye-height-value').textContent = seat.eye_height_m + 'm';
            
            const infoDiv = document.getElementById('seat-info');
            infoDiv.style.display = 'block';
            document.getElementById('seat-name').textContent = seat.name || 'Custom Position';
            document.getElementById('seat-coords').textContent = 
                `Eye: ${seat.eye_elevation_m.toFixed(0)}m ASL`;
            
            buildTrack();
            buildCornerLabels();
            buildSeatMarker();
            updateVisibilityStats();
            drawMinimap();
        }

        function updateStats() {
            const stats = trackData.stats;
            document.getElementById('stat-length').textContent = 
                `${(stats.length_m / 1000).toFixed(2)} km`;
            document.getElementById('stat-elev-range').textContent = 
                `${stats.elevation_range_m.toFixed(0)} m`;
            document.getElementById('stat-max-up').textContent = 
                `+${stats.max_uphill_pct.toFixed(1)}%`;
            document.getElementById('stat-max-down').textContent = 
                `${stats.max_downhill_pct.toFixed(1)}%`;
            
            updateCornersDisplay();
        }

        function updateVisibilityStats() {
            if (!currentSeat || !currentVisibility) {
                document.getElementById('stat-visible-pct').textContent = '-';
                document.getElementById('stat-hidden-pct').textContent = '-';
                return;
            }
            
            document.getElementById('stat-visible-pct').textContent = 
                `${currentSeat.visible_pct.toFixed(1)}%`;
            document.getElementById('stat-hidden-pct').textContent = 
                `${(100 - currentSeat.visible_pct).toFixed(1)}%`;
            
            updateCornersDisplay();
        }

        function updateCornersDisplay() {
            const corners = trackData.corners;
            const sortedCorners = [...corners]
                .map((c, i) => ({ ...c, originalIndex: i }))
                .sort((a, b) => a.position_m - b.position_m);
            
            const list = document.getElementById('corners-list');
            list.innerHTML = sortedCorners.map((c, i) => {
                const visible = isCornerVisible(c);
                const visClass = currentSeat ? (visible ? 'visible' : 'hidden') : '';
                const icon = currentSeat ? (visible ? '✓' : '✗') : '•';
                return `<li class="${visClass}">${icon} T${i + 1} (R=${c.radius_m.toFixed(0)}m)</li>`;
            }).join('');
        }

        function sampleTerrainElevation(worldX, worldZ) {
            return sampleTerrainHeight(worldX, -worldZ);
        }

        function worldToLatLon(worldX, worldZ) {
            const center = trackData.center;
            const lat_scale = 111320;
            const lon_scale = 111320 * Math.cos(center.lat * Math.PI / 180);
            return {
                lon: center.lon + worldX / lon_scale,
                lat: center.lat + (-worldZ) / lat_scale
            };
        }

        function checkLineOfSight(obsX, obsZ, obsElev, targetX, targetZ, targetElev, numSamples = 50) {
            for (let i = 1; i < numSamples; i++) {
                const t = i / numSamples;
                const sampleX = obsX + t * (targetX - obsX);
                const sampleZ = obsZ + t * (targetZ - obsZ);
                const terrainElev = sampleTerrainElevation(sampleX, sampleZ);
                if (terrainElev === null) continue;
                const losElev = obsElev + t * ((targetElev + 0.5) - obsElev);
                if (terrainElev > losElev) return false;
            }
            return true;
        }

        function computeViewshedForPosition(seatX, seatY, groundElev, eyeHeight) {
            const eyeElev = groundElev + eyeHeight;
            const points = trackData.points;
            const visibility = [];
            
            for (const p of points) {
                const visible = checkLineOfSight(seatX, -seatY, eyeElev, p.x, -p.y, p.z);
                visibility.push(visible);
            }
            
            let visibleLength = 0;
            let totalLength = 0;
            for (let i = 0; i < points.length - 1; i++) {
                const segLen = points[i + 1].distance - points[i].distance;
                totalLength += segLen;
                if (visibility[i] && visibility[i + 1]) visibleLength += segLen;
            }
            
            return {
                visibility,
                visible_length_m: visibleLength,
                visible_pct: totalLength > 0 ? (visibleLength / totalLength) * 100 : 0
            };
        }

        function onCanvasClick(event) {
            if (animatingCamera) return;
            
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            if (terrainMesh) {
                const intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    const eyeHeight = parseFloat(document.getElementById('eye-height').value);
                    
                    const seatX = point.x;
                    const seatY = -point.z;
                    const groundElev = sampleTerrainElevation(seatX, point.z);
                    
                    if (groundElev === null) return;
                    
                    const latLon = worldToLatLon(seatX, point.z);
                    const viewshed = computeViewshedForPosition(seatX, seatY, groundElev, eyeHeight);
                    
                    selectSeat({
                        id: null,
                        name: 'Custom Position',
                        lon: latLon.lon,
                        lat: latLon.lat,
                        x: seatX,
                        y: seatY,
                        ground_elevation_m: groundElev,
                        eye_height_m: eyeHeight,
                        eye_elevation_m: groundElev + eyeHeight,
                        visibility: viewshed.visibility,
                        visible_pct: viewshed.visible_pct,
                        visible_length_m: viewshed.visible_length_m
                    });
                }
            }
        }

        function animateCamera(targetPos, targetLookAt, duration = 1000) {
            animatingCamera = true;
            
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();
            
            function update() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                
                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLookAt, ease);
                controls.update();
                
                if (t < 1) {
                    requestAnimationFrame(update);
                } else {
                    animatingCamera = false;
                }
            }
            
            update();
        }

        function jumpToEyeView() {
            if (!currentSeat || animatingCamera) return;
            
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const terrainElev = sampleTerrainHeight(currentSeat.x, currentSeat.y);
            
            const eyePos = new THREE.Vector3(
                currentSeat.x,
                (terrainElev - baseElevation) * exag + currentSeat.eye_height_m * exag,
                -currentSeat.y
            );
            
            const avgZ = trackData.points.reduce((s, p) => s + p.z, 0) / trackData.points.length;
            const targetLookAt = new THREE.Vector3(
                trackBbox.centerX,
                (avgZ - baseElevation) * exag,
                -trackBbox.centerY
            );
            
            animateCamera(eyePos, targetLookAt, 1000);
        }

        function jumpToOrbitView() {
            if (animatingCamera) return;
            
            const exag = parseFloat(document.getElementById('exaggeration').value);
            const size = Math.max(trackBbox.width, trackBbox.height);
            const dist = size * 1.2;
            
            const avgZ = trackData.points.reduce((s, p) => s + p.z, 0) / trackData.points.length;
            const centerY = (avgZ - baseElevation) * exag;
            
            const targetPos = new THREE.Vector3(
                trackBbox.centerX + dist * 0.6,
                centerY + dist * 0.7,
                -trackBbox.centerY + dist * 0.6
            );
            const targetLookAt = new THREE.Vector3(trackBbox.centerX, centerY, -trackBbox.centerY);
            
            animateCamera(targetPos, targetLookAt, 1000);
        }

        function setupControls() {
            const exagSlider = document.getElementById('exaggeration');
            const exagValue = document.getElementById('exag-value');
            
            exagSlider.addEventListener('input', () => {
                exagValue.textContent = exagSlider.value + '×';
                buildTerrain();
                buildTrack();
                buildCornerLabels();
                buildSeatMarker();
            });
            
            document.getElementById('show-terrain').addEventListener('change', (e) => {
                if (terrainMesh) terrainMesh.visible = e.target.checked;
            });
            
            document.getElementById('show-track').addEventListener('change', (e) => {
                if (trackGroup) trackGroup.visible = e.target.checked;
            });
            
            document.getElementById('show-labels').addEventListener('change', (e) => {
                cornerLabels.forEach(l => l.visible = e.target.checked);
            });
            
            document.getElementById('seat-select').addEventListener('change', (e) => {
                const seatId = e.target.value;
                if (seatId && trackData.preset_seats) {
                    const seat = trackData.preset_seats.find(s => s.id === seatId);
                    if (seat) selectSeat(seat);
                }
            });
            
            document.getElementById('eye-height').addEventListener('input', (e) => {
                const height = parseFloat(e.target.value);
                document.getElementById('eye-height-value').textContent = height + 'm';
                
                if (currentSeat && !currentSeat.id) {
                    const viewshed = computeViewshedForPosition(
                        currentSeat.x, currentSeat.y,
                        currentSeat.ground_elevation_m, height
                    );
                    
                    currentSeat.eye_height_m = height;
                    currentSeat.eye_elevation_m = currentSeat.ground_elevation_m + height;
                    currentSeat.visibility = viewshed.visibility;
                    currentSeat.visible_pct = viewshed.visible_pct;
                    currentSeat.visible_length_m = viewshed.visible_length_m;
                    currentVisibility = viewshed.visibility;
                    
                    buildTrack();
                    buildCornerLabels();
                    buildSeatMarker();
                    updateVisibilityStats();
                    drawMinimap();
                }
            });
            
            document.getElementById('btn-eye-view').addEventListener('click', jumpToEyeView);
            document.getElementById('btn-orbit-view').addEventListener('click', jumpToOrbitView);
        }

        function onResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
            drawMinimap();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
